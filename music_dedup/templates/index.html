<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音乐库控制台</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main class="console-shell">
    <header class="console-header">
      <div>
        <h1>音乐库控制台</h1>
        <p>安全维护音乐库中的重复歌曲、外挂歌词和专辑封面。</p>
      </div>
      <div class="connection-state" id="connection-state">
        <span class="connection-state__dot"></span>
        <span>连接中</span>
      </div>
    </header>

    <section class="action-section" aria-labelledby="actions-title">
      <div class="section-heading">
        <div>
          <h2 id="actions-title">执行操作</h2>
          <p>每次点击只启动一个后台任务，已有任务运行时不会重复执行。</p>
        </div>
        <label class="token-field">
          <span>访问令牌</span>
          <input id="token" type="password" autocomplete="off" placeholder="如未设置可留空">
        </label>
      </div>
      <div class="action-grid">
        <button class="action-button action-button--primary" data-action="dedup">
          <span class="action-button__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3h10v4H7zM5 9h14v12H5zM8 12h8M8 16h5"/></svg>
          </span>
          <span><strong>执行去重</strong><small>保留最佳版本，重复文件移入隔离目录</small></span>
        </button>
        <button class="action-button" data-action="lyrics">
          <span class="action-button__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 8l10-2M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6M16 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg>
          </span>
          <span><strong>获取外挂歌词</strong><small>优先同步歌词，保存为同名 .lrc 或 .txt</small></span>
        </button>
        <button class="action-button" data-action="artwork">
          <span class="action-button__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          </span>
          <span><strong>获取专辑封面</strong><small>按 Artist 和 Album 保存为 cover 图片</small></span>
        </button>
        <button class="action-button action-button--quiet" data-action="all">
          <span class="action-button__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16M8 4v16M16 4v16"/></svg>
          </span>
          <span><strong>全部执行</strong><small>依次完成去重、歌词和专辑封面</small></span>
        </button>
      </div>
    </section>

    <section class="status-section" aria-labelledby="status-title">
      <div class="status-overview">
        <div>
          <h2 id="status-title">运行状态</h2>
          <p id="status-detail">尚未运行任务</p>
        </div>
        <div class="status-badge" id="status-badge">空闲</div>
      </div>
      <div class="summary-grid" id="summary-grid">
        <div class="summary-item"><span>读取音频</span><strong>—</strong></div>
        <div class="summary-item"><span>重复组</span><strong>—</strong></div>
        <div class="summary-item"><span>已移动</span><strong>—</strong></div>
        <div class="summary-item"><span>本次新增</span><strong>—</strong></div>
      </div>
    </section>

    <section class="log-section" aria-labelledby="log-title">
      <div class="section-heading section-heading--compact">
        <div>
          <h2 id="log-title">任务日志</h2>
          <p id="report-time">等待报告</p>
        </div>
        <button class="refresh-button" id="refresh" type="button">刷新</button>
      </div>
      <pre class="log-view" id="log">等待任务输出…</pre>
    </section>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
